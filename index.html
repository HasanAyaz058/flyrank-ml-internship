<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Layout</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfcfc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px;
        }

        /* Container for the three columns */
        .container {
            display: flex;
            gap: 40px;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 280px;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #444;
            margin-bottom: 15px;
        }

        /* The browser/page frame */
        .page-frame {
            width: 100%;
            height: 450px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Common styles for nav and header boxes */
        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 2px solid;
        }

        .main-nav {
            height: 45px;
            background-color: #e6f4ef;
            border-color: #4b7d6e;
            color: #1c4e3f;
        }

        .secondary-box {
            height: 35px;
            background-color: #f1f0e8;
            border-color: #8d8b83;
            color: #6e6c64;
        }

        /* The expandable body section */
        .main-body {
            flex-grow: 1;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            background-color: #fafafa;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-wrapper">
            <div class="page-title">Page 1</div>
            <div class="page-frame">
                <div class="box main-nav">Main Nav Bar</div>
                <div class="box secondary-box">Page 1 Header</div>
                <div class="main-body">Main Body</div>
                <div class="box secondary-box">Other Nav</div>
            </div>
        </div>

        <div class="page-wrapper">
            <div class="page-title">Page 2</div>
            <div class="page-frame">
                <div class="box main-nav">Main Nav Bar</div>
                <div class="box secondary-box">Page 2 Header</div>
                <div class="main-body">Main Body</div>
                <div class="box secondary-box">Other Nav</div>
            </div>
        </div>

        <div class="page-wrapper">
            <div class="page-title">Page 3</div>
            <div class="page-frame">
                <div class="box main-nav">Main Nav Bar</div>
                <div class="box secondary-box">Page 3 Header</div>
                <div class="main-body">Main Body</div>
                <div class="box secondary-box">Other Nav</div>
            </div>
        </div>
    </div>

</body>
</html>
